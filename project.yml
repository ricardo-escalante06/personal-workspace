# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: PersonalWorkspace
options:
  bundleIdPrefix: com.rescalante.workspace
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  WorkspaceKit:
    path: Packages/WorkspaceKit

targets:
  Workspace-macOS:
    type: application
    platform: macOS
    sources:
      - Apps/Shared
      - Apps/SharedCore
      - path: Apps/macOS
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: WorkspaceKit
        product: WorkspaceKit
      - package: WorkspaceKit
        product: WorkspaceRemote
      - package: WorkspaceKit
        product: WorkspaceUI
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Workspace
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Workspace shows your calendar events (including Google Calendar) next to your tasks, and lets you move events you can edit.
        NSCalendarsUsageDescription: Workspace shows your calendar events next to your tasks.
        NSRemindersFullAccessUsageDescription: Workspace can import your Apple Reminders as tasks.
        NSRemindersUsageDescription: Workspace can import your Apple Reminders as tasks.
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        GoogleClientID: $(GOOGLE_CLIENT_ID)
    entitlements:
      path: Apps/macOS/Workspace.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Read/write the user's calendars (Google via macOS Calendar accounts).
        com.apple.security.personal-information.calendars: true
        com.apple.developer.applesignin: [Default]
        # Supabase stores the session in the Keychain.
        keychain-access-groups: ["$(AppIdentifierPrefix)com.rescalante.workspace"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rescalante.workspace
        PRODUCT_NAME: Workspace

  Workspace-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/Shared
      - Apps/SharedCore
      - path: Apps/iOS
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: WorkspaceKit
        product: WorkspaceKit
      - package: WorkspaceKit
        product: WorkspaceRemote
      - package: WorkspaceKit
        product: WorkspaceUI
      - target: Workspace-Widgets
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Workspace
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: Workspace shows your calendar events (including Google Calendar) next to your tasks, and lets you move events you can edit.
        NSCalendarsUsageDescription: Workspace shows your calendar events next to your tasks.
        NSRemindersFullAccessUsageDescription: Workspace can import your Apple Reminders as tasks.
        NSRemindersUsageDescription: Workspace can import your Apple Reminders as tasks.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SharedKeychainGroup: $(AppIdentifierPrefix)com.rescalante.workspace
        CFBundleURLTypes:
          - CFBundleURLName: com.rescalante.workspace
            CFBundleURLSchemes: [workspace]
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        GoogleClientID: $(GOOGLE_CLIENT_ID)
    entitlements:
      path: Apps/iOS/Workspace.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Shared with the widgets and Siri: the local database lives in this group.
        com.apple.security.application-groups: [group.com.rescalante.workspace]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.rescalante.workspace"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rescalante.workspace
        PRODUCT_NAME: Workspace
        TARGETED_DEVICE_FAMILY: "1"

  Workspace-Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Widgets
        excludes: ["*.plist", "*.entitlements"]
      - Apps/SharedCore
    dependencies:
      - package: WorkspaceKit
        product: WorkspaceKit
      - package: WorkspaceKit
        product: WorkspaceUI
      - package: WorkspaceKit
        product: WorkspaceRemote
    info:
      path: Apps/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Workspace
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        SharedKeychainGroup: $(AppIdentifierPrefix)com.rescalante.workspace
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rescalante.workspace]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.rescalante.workspace"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rescalante.workspace.widgets
        PRODUCT_NAME: WorkspaceWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
